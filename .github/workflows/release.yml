# A v* tag: the check, and beside it the source archive of the tag's commit and the image for amd64 and arm64 on GHCR
# under the tag. Once both pass, a release carrying that archive and image-digest.txt (one line, sha256:…;
# scripts/deploy.sh reads it), and :latest moves to the highest plain vMAJOR.MINOR.PATCH release. A tag
# whose check failed may have an image, but never a release, so neither a deploy nor :latest takes it.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  image:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile copies release/source.tar.gz into the image; its context has no .git to make one.
      - run: |
          mkdir -p dist/client release
          scripts/source.sh
          mv dist/client/source.tar.gz release/source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: release/source.tar.gz
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          # The working tree, not the action's default git context, which would leave release/ out.
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jiniill/hazelle:${{ github.ref_name }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

  release:
    needs: [check, image]
    runs-on: ubuntu-24.04
    steps:
      # The archive inside the image, not a second one made here.
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          echo "$DIGEST" >release/image-digest.txt
          gh release create "$GITHUB_REF_NAME" release/source.tar.gz release/image-digest.txt --title "$GITHUB_REF_NAME" \
            --notes "image: ghcr.io/jiniill/hazelle:$GITHUB_REF_NAME; its digest is image-digest.txt"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Promotes the highest release rather than this run's, so a run that finished late, or a maintenance tag, cannot
      # move :latest back. A newer tag still building has no release yet; its own run promotes it.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          highest=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -rV | head -1 || true)
          [ -n "$highest" ] || { echo "no plain version release; :latest unchanged"; exit 0; }
          docker buildx imagetools create -t ghcr.io/jiniill/hazelle:latest "ghcr.io/jiniill/hazelle:$highest"
          echo ":latest is $highest"
