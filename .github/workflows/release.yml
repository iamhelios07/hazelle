# A v* tag: the check, and beside it the source archive of the tag's commit and the image for amd64 and arm64 on GHCR
# under the tag, then the start without Docker copied out of that image. Once all pass, a release carrying that archive,
# image-digest.txt (one line, sha256:…; scripts/deploy.sh reads it), the files a self-hosted install starts from
# (docker-compose.yml, rclone-backup.sh for its backup profile, the install scripts in deploy/, hazelle-app.tar.gz and
# hazelle-windows-x64.zip), its notes the commits since the previous tag (scripts/release-notes.sh) and how to start,
# and :latest moves to the highest plain vMAJOR.MINOR.PATCH release. A tag whose check failed may have an image, but never a
# release, so neither a deploy nor :latest takes it.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  image:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile copies release/source.tar.gz into the image; its context has no .git to make one.
      - run: |
          mkdir -p dist/client release
          scripts/source.sh
          mv dist/client/source.tar.gz release/source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: release/source.tar.gz
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          # The working tree, not the action's default git context, which would leave release/ out.
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jiniill/hazelle:${{ github.ref_name }}
          build-args: HAZELLE_VERSION=${{ github.ref_name }}
          # The source label links the GHCR package to this repository on push.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # The image's /app as it is, so the start without Docker runs the image's bytes; the Windows zip adds the Node the image
  # runs, from nodejs.org.
  portable:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - env:
          IMAGE: ghcr.io/jiniill/hazelle@${{ needs.image.outputs.digest }}
        run: |
          mkdir -p release/windows/hazelle/node
          docker create --platform linux/amd64 --name app "$IMAGE"
          docker cp app:/app release/app
          tar -czf release/hazelle-app.tar.gz -C release app
          node=$(docker run --rm --platform linux/amd64 --entrypoint node "$IMAGE" -p process.versions.node)
          curl -fsSLO "https://nodejs.org/dist/v$node/node-v$node-win-x64.zip"
          curl -fsSL "https://nodejs.org/dist/v$node/SHASUMS256.txt" | grep " node-v$node-win-x64.zip\$" | sha256sum -c -
          unzip -jq "node-v$node-win-x64.zip" "node-v$node-win-x64/node.exe" "node-v$node-win-x64/LICENSE" -d release/windows/hazelle/node
          mv release/app release/windows/hazelle/app
          cp deploy/start-hazelle.bat release/windows/hazelle/
          (cd release/windows && zip -qr ../hazelle-windows-x64.zip hazelle)
      - uses: actions/upload-artifact@v7
        with:
          name: portable
          path: |
            release/hazelle-app.tar.gz
            release/hazelle-windows-x64.zip

  release:
    needs: [check, image, portable]
    runs-on: ubuntu-24.04
    steps:
      # The whole history, for the notes' commits since the previous tag; before the download, which it would wipe.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The archive inside the image, not a second one made here.
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: portable
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          echo "$DIGEST" >release/image-digest.txt
          {
            scripts/release-notes.sh "$GITHUB_REF_NAME"
            printf '\n## 내 기기에 설치하기\n\n'
            printf -- '- 윈도우: `hazelle-windows-x64.zip`을 풀고 `start-hazelle.bat`을 실행해요. 도커는 필요 없어요.\n'
            printf -- '- 도커: `install-docker.ps1`(윈도우)이나 `install-docker.sh`(macOS, 리눅스)가 설치하고 업데이트해요.\n'
            printf -- '- 안드로이드: Termux에서 `install.sh`를 실행해요.\n\n'
            printf '이 버전의 이미지는 `ghcr.io/jiniill/hazelle:%s`(amd64, arm64)예요. ' "$GITHUB_REF_NAME"
            printf '명령어와 업데이트, 백업은 [설치 안내](%s/blob/master/README.ko.md)에 있어요.\n' \
              "$GITHUB_SERVER_URL/$GH_REPO"
          } >release/notes.md
          cp deploy/rclone-backup.sh release/
          gh release create "$GITHUB_REF_NAME" release/source.tar.gz release/image-digest.txt docker-compose.yml \
            release/rclone-backup.sh release/hazelle-app.tar.gz release/hazelle-windows-x64.zip deploy/install.sh \
            deploy/install-docker.sh deploy/install-docker.ps1 --title "$GITHUB_REF_NAME" --notes-file release/notes.md
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Promotes the highest release rather than this run's, so a run that finished late, or a maintenance tag, cannot
      # move :latest back. A newer tag still building has no release yet; its own run promotes it.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          highest=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -rV | head -1 || true)
          [ -n "$highest" ] || { echo "no plain version release; :latest unchanged"; exit 0; }
          docker buildx imagetools create -t ghcr.io/jiniill/hazelle:latest "ghcr.io/jiniill/hazelle:$highest"
          echo ":latest is $highest"
