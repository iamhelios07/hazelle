# A v* tag: the check, the source archive of the tag's commit, the image for amd64 and arm64 on GHCR under the tag, and
# a release carrying the archive and image-digest.txt (one line, sha256:…; scripts/deploy.sh reads it). Then :latest
# moves to the highest plain vMAJOR.MINOR.PATCH tag whose image exists.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      # The Dockerfile copies release/source.tar.gz into the image; its context has no .git to make one.
      - run: |
          mkdir -p dist/client release
          scripts/source.sh
          mv dist/client/source.tar.gz release/source.tar.gz
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          # The working tree, not the action's default git context, which would leave release/ out.
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jiniill/hazelle:${{ github.ref_name }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "$DIGEST" >release/image-digest.txt
          gh release create "$GITHUB_REF_NAME" release/source.tar.gz release/image-digest.txt --title "$GITHUB_REF_NAME" \
            --notes "image: ghcr.io/jiniill/hazelle:$GITHUB_REF_NAME; its digest is image-digest.txt"

  # Promotes the highest tag rather than this run's, so a run that waited, or a maintenance tag, cannot move :latest
  # back; a pending run that the group cancels is covered by the next one.
  latest:
    needs: release
    runs-on: ubuntu-24.04
    concurrency:
      group: latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          tags=$(git tag --list 'v[0-9]*' --sort=-v:refname)
          highest=$(echo "$tags" | grep -m1 -xE 'v[0-9]+\.[0-9]+\.[0-9]+' || true)
          [ -n "$highest" ] || { echo "no plain version tag; :latest unchanged"; exit 0; }
          if ! docker buildx imagetools inspect "ghcr.io/jiniill/hazelle:$highest" >/dev/null; then
            echo "$highest has no image (its run is still building, or failed); :latest unchanged"
            exit 0
          fi
          docker buildx imagetools create -t ghcr.io/jiniill/hazelle:latest "ghcr.io/jiniill/hazelle:$highest"
          echo ":latest is $highest"
