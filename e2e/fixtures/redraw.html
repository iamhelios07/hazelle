<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Story redraw anchor</title></head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement as h, useState } from 'react';
      import { createRoot } from 'react-dom/client';
      import { useFollow } from '../../src/app/chat/useFollow';
      import { ChatFrame } from '../../src/app/ui/layout/ChatFrame';
      import { Viewport } from '../../src/app/ui/collections/Viewport';
      import { Story } from '../../src/app/ui/story/Story';
      import '../../src/app/ui/foundation/global.css';

      const para = (i, words) => `<p data-i="${i}">${Array.from({ length: words }, (_, w) => `word${i}-${w}`).join(' ')}</p>`;
      const translated = Array.from({ length: 40 }, (_, i) => para(i, 20)).join('');
      const original = Array.from({ length: 40 }, (_, i) => para(i, 45 + (i % 3) * 10)).join('');
      function Chat() {
        const [flipped, setFlipped] = useState(false);
        const scroll = useFollow(3, false, null, true);
        const keys = ['a', 'long', 'b'];
        return h(ChatFrame, {
          title: 'Story redraw anchor', actions: null, above: null,
          reading: { font: 'sans', size: 16, leading: 'normal', width: 'normal', reply: 'stay' },
          hideHeader: false, compact: false, scrollRef: scroll.scrollRef, onScroll: scroll.onScroll,
          footer: h('div', { style: { height: 90 } }, h('button', { onClick: () => setFlipped((f) => !f) }, 'Flip')),
        }, h(Viewport, { variant: 'story', keys, seek: scroll.seek },
          (index) => keys[index] === 'long' ? h('div', null, h(Story, { html: flipped ? original : translated })) : h('div', { style: { height: 300 } }, keys[index]),
        ));
      }
      createRoot(document.getElementById('root')).render(h(Chat));
    </script>
  </body>
</html>
